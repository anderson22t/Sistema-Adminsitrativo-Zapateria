<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zapatería</title>
    <link rel="icon" type="image/png" href="componentes/iconos/favicon-32x32.png" />
    <link rel="stylesheet" href="css/estilos.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="contenedorInicioSesion">
        <h1>ZAPATERÍA</h1>
        <form action="" method="POST" id="formularioInicioSesion">
            <label for="usuario">Nombre de Usuario</label>
            <input type="text" name="usuario" id="usuario" placeholder="Usuario" required>
            <label for="contraseña">Contraseña</label>
            <div class="campoContraseña">
                <input type="password" name="contraseña" id="contraseña" placeholder="Contraseña" required>
                <button type="button" id="btnMostrarContraseña" aria-label="Mostrar contraseña" title="Mostrar contraseña">
                    <ion-icon name="eye-outline"></ion-icon>
                </button>
            </div>
            <input type="submit" id="btnInicioSesion" value="Iniciar Sesión">
            <a href="#">Olvidaste la Contraseña</a>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/inicioSesion.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</body>
</html>
